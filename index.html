<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑돌 미식축구 감독</title>
<style>
  :root { --bg: #f4f1ea; --panel: #ffffff; --ink: #222; --muted: #777; --line: #e5dfd3; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171815; --panel: #24251f; --ink: #eee; --muted: #9a9a92; --line: #3a3b34; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  button { font-family: inherit; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #fff; margin-right: 6px; vertical-align: 1px; }

  /* 메뉴·대기실·끝 화면 */
  .screen { position: fixed; inset: 0; display: none; place-items: center; background: var(--bg); z-index: 10; }
  .box { background: var(--panel); border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.15); padding: 26px 30px; width: min(380px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; }
  .box h1 { margin: 0 0 4px; font-size: 25px; }
  .box .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .box input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; font: 16px inherit; margin-bottom: 10px; text-align: center; background: var(--panel); color: var(--ink); }
  .box button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #e07b39; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
  .box button.alt { background: #3a78c9; }
  .box button.ghost { background: var(--line); color: var(--ink); }
  .box button:disabled { opacity: .5; cursor: default; }
  .box .row { display: flex; gap: 8px; }
  .box .row input { margin: 0; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; }
  .box .row button { width: 90px; margin: 0; }
  .box hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  #err { color: #d33; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #status { color: var(--muted); font-size: 13px; }
  #roomCode { font-size: 40px; font-weight: 900; letter-spacing: 8px; margin: 4px 0 8px; }
  #lobbyList { list-style: none; padding: 0; margin: 14px 0; text-align: left; }
  #lobbyList li { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  #lobbyList small { color: var(--muted); margin-left: 18px; }
  .linkrow { display: flex; gap: 6px; margin-bottom: 8px; }
  .linkrow input { margin: 0; font-size: 12px; text-align: left; }
  .linkrow button { width: 80px; margin: 0; font-size: 12px; background: #888; }
  .final { font-size: 30px; font-weight: 900; margin: 10px 0; }

  /* 경기 화면 */
  #game { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr 260px; gap: 8px; padding: 8px; box-sizing: border-box; }
  #scoreboard { grid-column: 1 / 3; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; background: var(--panel); border-radius: 12px; padding: 8px 14px; }
  .sc-side { display: flex; align-items: center; gap: 12px; }
  .sc-side.right { flex-direction: row; justify-content: flex-end; }
  .sc-side.right .sc-team { order: 2; text-align: right; }
  .sc-side.right .sc-num { order: 1; }
  .sc-name { font-weight: 900; font-size: 16px; color: var(--tc); }
  .sc-coach { font-size: 12px; color: var(--muted); }
  .sc-num { font-size: 34px; font-weight: 900; min-width: 44px; text-align: center; }
  .sc-mid { text-align: center; }
  .sc-down { font-weight: 900; font-size: 17px; }
  .sc-where { font-size: 12px; color: var(--muted); }
  #fieldWrap { position: relative; min-height: 0; }
  #field { width: 100%; height: 100%; display: block; border-radius: 12px; }
  #reveal { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--panel); border-radius: 99px; padding: 6px 16px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  #reveal .vs { color: var(--muted); margin: 0 6px; }
  #banner { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: #e24b4a; color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
  #side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #side .sbox { background: var(--panel); border-radius: 12px; padding: 10px; }
  #side button { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; font-size: 13px; margin-bottom: 6px; }
  #log { overflow-y: auto; flex: 1; min-height: 0; }
  .lg { font-size: 13px; padding: 6px 2px; border-bottom: 1px solid var(--line); line-height: 1.4; }
  .lg small { color: var(--muted); }
  .muted { color: var(--muted); }
  #call { grid-column: 1 / 3; background: var(--panel); border-radius: 12px; padding: 10px 12px; }
  #resultLine { font-size: 14px; margin-bottom: 6px; min-height: 18px; }
  #resultLine.big { color: #c0391b; font-weight: 700; }
  #role { font-weight: 700; font-size: 15px; }
  #hint { font-size: 13px; color: var(--muted); margin: 3px 0 6px; }
  .tbar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #timer { height: 100%; width: 0; transition: width .2s linear; }
  #timerTxt, #waitMsg { font-size: 12px; color: var(--muted); }
  #waitMsg { font-weight: 700; color: var(--accent); }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
  .card { text-align: left; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card.on { border: 2.5px solid var(--accent); background: rgba(47,111,214,.08); }
  .card.dim { opacity: .4; }
  .card .cn { font-weight: 900; font-size: 14px; }
  .card .ic { display: inline-block; width: 20px; color: var(--accent); }
  .card .cd { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .card .cg, .card .cb { font-size: 11px; }
  .card .cg { color: #2e8b3a; } .card .cb { color: #c0391b; }

  #roster { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 20; }
  #roster .box { width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; text-align: left; padding: 16px 18px; }
  #roster table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #roster td { padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #roster tr.grp td { font-weight: 900; padding-top: 10px; }
  #roster th { text-align: left; font-size: 12px; color: var(--muted); padding: 4px 6px; }

  @media (max-width: 760px) {
    #game { grid-template-columns: 1fr; grid-template-rows: auto 46vh auto auto; height: auto; min-height: 100%; }
    #scoreboard, #call { grid-column: 1; }
    #side { order: 4; }
    #log { max-height: 200px; }
    .sc-num { font-size: 24px; min-width: 30px; }
    #scoreboard { padding: 6px 8px; gap: 4px; }
    .sc-side { gap: 4px; }
    .sc-name { font-size: 13px; }
    .sc-name .pill { display: none; }
    .sc-team.has .sc-name::after { content: ' ●'; color: var(--accent); }
    .sc-coach { display: none; }
    .sc-down { font-size: 14px; }
  }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="game" style="display:none">
  <div id="scoreboard"></div>
  <div id="fieldWrap">
    <canvas id="field"></canvas>
    <div id="reveal" style="display:none"></div>
    <div id="banner" style="display:none"></div>
  </div>
  <div id="side">
    <div class="sbox"><button id="teamBtnMe"></button><button id="teamBtnOpp"></button></div>
    <div class="sbox" id="log"></div>
  </div>
  <div id="call">
    <div id="resultLine"></div>
    <div id="role"></div>
    <div id="hint"></div>
    <div class="tbar"><div id="timer"></div></div>
    <div><span id="timerTxt"></span> <span id="waitMsg"></span></div>
    <div id="cards"></div>
  </div>
</div>

<div id="roster"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div id="rosterTitle" style="font-weight:900;font-size:17px"></div><button id="rosterClose" style="width:auto;padding:6px 14px;margin:0" class="ghost">닫기</button></div>
  <table><tr><th>번호</th><th>이름</th><th>포지션</th><th>속도</th><th>힘</th><th>민첩</th><th>전문 1</th><th>전문 2</th></tr><tbody id="rosterBody"></tbody></table>
</div></div>

<div class="screen" id="menu">
  <div class="box">
    <h1>🏈 바둑돌 미식축구 감독</h1>
    <div class="sub">작전만 고르면 선수들이 알아서 뛰어요.<br>친구와 동시에 작전을 고르고 수를 읽어 보세요.</div>
    <input id="name" placeholder="내 이름" maxlength="8">
    <button id="resumeBtn" class="alt" style="display:none"></button>
    <button id="hostBtn">방 만들기</button>
    <hr>
    <div class="row"><input id="code" placeholder="코드" maxlength="4"><button id="joinBtn" class="alt">참가</button></div>
    <div id="err"></div>
    <div id="status"></div>
  </div>
</div>

<div class="screen" id="lobbyScreen">
  <div class="box">
    <div class="sub">방 코드 (친구에게 알려 주세요)</div>
    <div id="roomCode"></div>
    <div class="linkrow"><input id="roomLink" readonly><button id="copyBtn">링크 복사</button></div>
    <ul id="lobbyList"></ul>
    <button id="swapBtn" class="ghost">팀 바꾸기</button>
    <button id="startBtn">경기 시작</button>
    <div class="sub" id="waitHost">방장이 경기를 시작하길 기다리는 중…</div>
  </div>
</div>

<div class="screen" id="endScreen">
  <div class="box">
    <h1>🏁 경기 끝!</h1>
    <div id="result"></div>
    <button id="againBtn">한 판 더</button>
    <div class="sub" id="againWait">방장이 다시 시작하길 기다리는 중…</div>
  </div>
</div>

<script src="data.js"></script>
<script src="sim.js"></script>
<script src="rules.js"></script>
<script src="view.js"></script>
<script src="main.js"></script>
</body>
</html>
